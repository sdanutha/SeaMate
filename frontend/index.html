<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeaMate — Multi-Agent Workspace</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- ── Topbar ──────────────────────────────────────────────── -->
  <div id="topbar">
    <span class="logo">SeaMate</span>
    <div class="topbar-spacer"></div>
    <button id="theme-toggle" title="Toggle dark/light mode">☀</button>
    <span id="conn-status" class="status offline">connecting...</span>
  </div>

  <!-- ── Layout ──────────────────────────────────────────────── -->
  <div id="layout">

    <!-- ── Sidebar ─────────────────────────────────────────── -->
    <nav id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-label">AGENTS</div>
        <div id="agents-list"></div>
      </div>
    </nav>

    <!-- ── Main Panel ───────────────────────────────────────── -->
    <div id="main">
      <div id="output"></div>

      <div id="input-bar">
        <span id="agent-label">seamate</span>
        <input id="msg-input" type="text"
          placeholder="type message and press Enter..."
          autocomplete="off" disabled />
        <button id="send-btn" disabled>Send</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
