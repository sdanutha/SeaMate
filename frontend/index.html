<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeaMate — Multi-Agent Workspace</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- ── Topbar ──────────────────────────────────────────────── -->
  <div id="topbar">
    <span class="logo">SeaMate</span>
    <span id="conn-status" class="status offline">connecting...</span>
  </div>

  <!-- ── Layout ──────────────────────────────────────────────── -->
  <div id="layout">

    <!-- ── Sidebar ─────────────────────────────────────────── -->
    <nav id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-label">AGENTS</div>
        <div id="agents-list"></div>
      </div>
      <div class="sidebar-section sessions-section">
        <div class="sidebar-section-label">
          SESSIONS
          <button id="new-session-btn" title="New session">+</button>
        </div>
        <div id="sessions-list"></div>
      </div>
    </nav>

    <!-- ── Main Panel ───────────────────────────────────────── -->
    <div id="main">
      <div id="agent-header">
        <div class="dot" id="header-dot"></div>
        <span id="header-title" class="agent-title">SeaMate</span>
        <span id="header-meta" class="agent-meta">· select or create a session →</span>
      </div>

      <div id="output">
        <div id="empty-state">
          <span>no session selected</span>
          <span class="hint">pick a session or press + to start</span>
        </div>
      </div>

      <div id="input-bar">
        <span id="agent-label">seamate</span>
        <input id="msg-input" type="text"
          placeholder="type message and press Enter..."
          autocomplete="off" disabled />
        <button id="send-btn" disabled>Send</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
